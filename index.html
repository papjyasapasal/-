<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>P.A.P JYASA PASAL — Accounts</title>
<style>
:root{--bg:#030c25;--card:#0a1636;--line:#1d2b55;--gold:#e8b94a;--gold2:#f6d77d;--txt:#f1ead7;--mut:#9aa4c0;--in:#2ecc71;--out:#ff4d4d}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header img{height:52px;width:52px;border-radius:8px;cursor:pointer}
header h1{font-size:19px;margin:0;color:var(--gold);letter-spacing:1px;cursor:pointer}
header small{display:block;color:var(--mut);font-size:11px;letter-spacing:3px}
.sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:20px}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1300;border:0;padding:10px 16px;border-radius:8px;font:bold 14px Georgia,serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.red{background:var(--out);color:#fff}.btn.green{background:var(--in);color:#04210f}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid .card{margin:0}
.card .l{color:var(--mut);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.card .v{font-size:24px;margin-top:6px;font-weight:bold}
.in{color:var(--in)}.out{color:var(--out)}.gold{color:var(--gold)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
input,select,textarea{background:#06102b;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:15px Georgia,serif;width:100%}
.bar input{flex:1;min-width:180px}
table{width:100%;border-collapse:collapse}
th{color:var(--mut);font-size:12px;letter-spacing:1px;text-transform:uppercase;text-align:left}
th,td{padding:10px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#0d1c45}
.wrap{overflow-x:auto}
.empty{text-align:center;color:var(--mut);padding:30px}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--gold);border-radius:14px;padding:22px;width:min(480px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog h3{margin:0 0 14px;color:var(--gold)}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.back{background:none;border:0;color:var(--gold);cursor:pointer;font:15px Georgia,serif;padding:0;margin-bottom:8px}
.top{border-color:var(--gold);background:linear-gradient(160deg,#0f1f4d,#0a1636)}
.err{color:var(--out);font-size:13px;min-height:16px;margin-top:6px}
.ok{color:var(--in)}
.banner{background:#2a2200;border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.bad{background:#2a0a0a;border-color:var(--out)}
.files{margin-top:8px}
.file{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#06102b;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:13px}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumbs a{display:block;background:#06102b;border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--gold);font-size:12px;text-decoration:none;word-break:break-all;text-align:center}
.thumbs img{width:100%;height:110px;object-fit:cover;border-radius:6px;display:block;margin-bottom:4px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:min(380px,100%);text-align:center}
#login img{width:200px;max-width:70%;border-radius:14px}
ul.chk{padding-left:18px;margin:8px 0}
@media print{header,.bar,.no-print,button,.banner{display:none!important}body{background:#fff;color:#000}.card{border:1px solid #999;background:#fff}.in{color:#080}.out{color:#b00}}
</style>
</head>
<body>

<section id="login" hidden>
  <div class="box">
    <img class="logo" alt="P.A.P JYASA PASAL">
    <div class="card" style="margin-top:14px;text-align:left">
      <label for="lpw" style="margin-top:0">Password</label>
      <input type="password" id="lpw" autocomplete="current-password" placeholder="Enter password">
      <div class="err" id="lerr"></div>
      <button class="btn" style="width:100%;margin-top:8px" onclick="doLogin()">Unlock</button>
    </div>
  </div>
</section>

<div id="shell" hidden>
<header>
  <img class="logo" alt="Logo" onclick="go()">
  <div><h1 onclick="go()">P.A.P JYASA PASAL</h1><small>EST. 2069 · ACCOUNTS</small></div>
  <div class="sp"></div>
  <button class="btn alt sm" onclick="go('settings')">⚙ Settings</button>
  <button class="btn alt sm" onclick="lock()">🔒 Lock</button>
</header>
<main id="app"></main>
</div>

<dialog id="dCust"><h3 id="dCustT">Add Customer</h3>
  <label>Name *</label><input id="cName">
  <label>Phone</label><input id="cPhone" inputmode="tel">
  <label>Address</label><input id="cAddr">
  <div class="err" id="cErr"></div>
  <div class="row"><button class="btn alt" onclick="dCust.close()">Cancel</button><button class="btn" onclick="saveCust()">Save</button></div>
</dialog>

<dialog id="dTx"><h3 id="dTxT">Money In</h3>
  <label>Date *</label><input type="date" id="tDate">
  <label>Amount (Rs) *</label><input id="tAmt" inputmode="decimal" placeholder="0.00">
  <label>Note</label><input id="tNote" placeholder="e.g. gold ring payment">
  <label>Attachments (photos, bill, PDF — max 10)</label>
  <input type="file" id="tFiles" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt">
  <div class="files" id="fList"></div>
  <div class="err" id="tErr"></div>
  <div class="row"><button class="btn alt" onclick="dTx.close()">Cancel</button><button class="btn" id="tSave" onclick="saveTx()">Save</button></div>
</dialog>

<dialog id="dAtt"><h3>Attachments</h3><div id="attBody"></div>
  <div class="row"><button class="btn alt" onclick="dAtt.close()">Close</button></div>
</dialog>

<input type="file" id="imp" accept=".json" hidden>

/* =====================================================================
   DATABASE — IndexedDB (stored inside the browser, works on GitHub Pages)
   Every multi-step change runs inside ONE atomic transaction:
   it is saved completely or not at all, so books can never go out of balance.
   ===================================================================== */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('papJyasaPasal_v3',2);
    r.onupgradeneeded=()=>{const d=r.result,u=r.transaction;
      if(!d.objectStoreNames.contains('customers'))d.createObjectStore('customers',{keyPath:'id',autoIncrement:true});
      const ts=d.objectStoreNames.contains('transactions')?u.objectStore('transactions'):d.createObjectStore('transactions',{keyPath:'id',autoIncrement:true});
      if(!ts.indexNames.contains('customerId'))ts.createIndex('customerId','customerId');
      if(!d.objectStoreNames.contains('attachments'))d.createObjectStore('attachments',{keyPath:'id',autoIncrement:true}).createIndex('txId','txId');
      if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})},
  read(s){return new Promise((res,rej)=>{const q=this.db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  write(stores,fn){return new Promise((res,rej)=>{const t=this.db.transaction(stores,'readwrite');
    t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Aborted — nothing was changed'));
    try{fn(t)}catch(e){try{t.abort()}catch{}rej(e)}})},
  setMeta(key,value){return this.write(['meta'],t=>t.objectStore('meta').put({key,value}))}
};

/* =====================================================================
   MONEY MATH — integers only (paisa). 1 Rs = 100 paisa. No decimals stored.
   ===================================================================== */
function parseMoney(s){s=String(s).trim().replace(/,/g,'');
  if(!/^\d+(\.\d{1,2})?$/.test(s))return null;
  const [a,b='']=s.split('.');const p=parseInt(a,10)*100+parseInt((b+'00').slice(0,2),10);
  return p>0&&Number.isSafeInteger(p)?p:null}
function fmt(p){const neg=p<0;p=Math.abs(p);
  return (neg?'-':'')+'Rs '+Math.floor(p/100).toLocaleString('en-IN')+'.'+String(p%100).padStart(2,'0')}
function totals(list){let i=0,o=0;for(const t of list){if(t.type==='in')i+=t.amount;else o+=t.amount}return{i,o,bal:i-o}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const balCls=b=>b>0?'in':b<0?'out':'gold';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
const $=id=>document.getElementById(id);

/* =====================================================================
   LOGIN — password only. Stored as a salted PBKDF2-SHA256 hash (never plain text).
   ===================================================================== */
const DEFAULT_SALT='a51a8ec574233bd1ba2ddb945e6b653e',DEFAULT_HASH='a8ed56b4951ed456ef8ba808a75907942c73900fb46cce6b2790f61c7bce4c07';
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function hashPw(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(salt),iterations:100000,hash:'SHA-256'},k,256))}
let meta={};
async function loadMeta(){(await DB.read('meta')).forEach(m=>meta[m.key]=m.value);
  if(!meta.auth){meta.auth={salt:DEFAULT_SALT,hash:DEFAULT_HASH};await DB.setMeta('auth',meta.auth)}}
async function verifyPw(pw){return (await hashPw(pw,meta.auth.salt))===meta.auth.hash}
const ls={get:k=>{try{return +localStorage.getItem(k)||0}catch{return 0}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
async function doLogin(){const e=$('lerr'),wait=ls.get('pap_lock')-Date.now();
  if(wait>0){e.textContent='Too many attempts. Wait '+Math.ceil(wait/1000)+'s.';return}
  if(await verifyPw($('lpw').value)){ls.set('pap_fail',0);sessionStorage.setItem('pap_auth','1');$('lpw').value='';e.textContent='';start()}
  else{let f=ls.get('pap_fail')+1;if(f>=5){ls.set('pap_lock',Date.now()+30000);f=0}ls.set('pap_fail',f);e.textContent='Wrong password.';$('lpw').select()}}
$('lpw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function lock(){sessionStorage.removeItem('pap_auth');document.querySelectorAll('dialog[open]').forEach(d=>d.close());
  $('shell').hidden=true;$('login').hidden=false;$('app').innerHTML='';$('lpw').focus()}
let idle;function bump(){clearTimeout(idle);if(sessionStorage.getItem('pap_auth'))idle=setTimeout(lock,10*60*1000)}
['click','keydown','touchstart','mousemove'].forEach(ev=>addEventListener(ev,bump,{passive:true}));

/* ===== State ===== */
let customers=[],txs=[],atts=[],byCust=new Map(),attByTx=new Map();

async function load(){[customers,txs,atts]=await Promise.all([DB.read('customers'),DB.read('transactions'),DB.read('attachments')]);
  byCust=new Map();txs.forEach(t=>{if(!byCust.has(t.customerId))byCust.set(t.customerId,[]);byCust.get(t.customerId).push(t)});
  attByTx=new Map();atts.forEach(a=>{if(!attByTx.has(a.txId))attByTx.set(a.txId,[]);attByTx.get(a.txId).push(a)});
  render()}
function go(page='home',id=null){view={page,id};render();scrollTo(0,0)}
const custTx=id=>byCust.get(id)||[];

/* ===== Integrity check — proves the books balance ===== */
function checkBooks(){const issues=[],cs=new Set(customers.map(c=>c.id)),ts=new Set(txs.map(t=>t.id));
  txs.forEach(t=>{
    if(!cs.has(t.customerId))issues.push(`Transaction #${t.id} belongs to a missing customer`);
    if(!Number.isSafeInteger(t.amount)||t.amount<=0)issues.push(`Transaction #${t.id} has an invalid amount`);
    if(t.type!=='in'&&t.type!=='out')issues.push(`Transaction #${t.id} has an invalid type`);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date||''))issues.push(`Transaction #${t.id} has an invalid date`)});
  atts.forEach(a=>{if(!ts.has(a.txId))issues.push(`Attachment "${a.name}" belongs to a missing transaction`)});
  const valid=txs.filter(t=>cs.has(t.customerId)),G=totals(valid);let si=0,so=0;
  customers.forEach(c=>{const x=totals(custTx(c.id));si+=x.i;so+=x.o});
  if(si!==G.i||so!==G.o||si-so!==G.bal)issues.push('Customer balances do not add up to the grand total');
  return{issues,G,customers:customers.length,txs:txs.length,atts:atts.length}}

  if(view.page==='settings')return renderSettings();

function banners(){let h='';const r=checkBooks();
  if(r.issues.length)h+=`<div class="banner bad">⚠ Data check found ${r.issues.length} problem(s). <button class="btn sm" onclick="go('settings')">Review</button></div>`;
  const lb=meta.lastBackup||0;
  if(customers.length&&Date.now()-lb>7*864e5)h+=`<div class="banner">💾 ${lb?'Last backup was '+Math.floor((Date.now()-lb)/864e5)+' days ago.':'You have never made a backup.'} <button class="btn sm" onclick="exportData()">Backup now</button></div>`;
  return h}

/* ===== Customer actions ===== */
function openCust(id=null){editCust=id;const c=customers.find(x=>x.id===id)||{};
  $('dCustT').textContent=id?'Edit Customer':'Add Customer';
  $('cName').value=c.name||'';$('cPhone').value=c.phone||'';$('cAddr').value=c.address||'';$('cErr').textContent='';
  dCust.showModal();$('cName').focus()}
async function saveCust(){const name=$('cName').value.trim();
  if(!name){$('cErr').textContent='Name is required.';return}
  const rec={name,phone:$('cPhone').value.trim(),address:$('cAddr').value.trim(),created:Date.now()};
  if(editCust){rec.id=editCust;rec.created=customers.find(x=>x.id===editCust).created}
  let newId=editCust;
  try{await DB.write(['customers'],t=>{const q=t.objectStore('customers').put(rec);q.onsuccess=()=>newId=q.result})}
  catch(e){$('cErr').textContent='Could not save: '+e.message;return}
  dCust.close();const isNew=!editCust;await load();if(isNew)go('cust',newId)}
async function delCust(id){const c=customers.find(x=>x.id===id);
  if(!confirm(`Delete "${c.name}" with ALL transactions and attachments? This cannot be undone.`))return;
  try{await DB.write(['customers','transactions','attachments'],t=>{
    const ts=t.objectStore('transactions'),as=t.objectStore('attachments');
    ts.index('customerId').getAllKeys(id).onsuccess=e=>e.target.result.forEach(tid=>{
      as.index('txId').getAllKeys(tid).onsuccess=e2=>e2.target.result.forEach(k=>as.delete(k));ts.delete(tid)});
    t.objectStore('customers').delete(id)})}catch(e){alert('Delete failed, nothing was changed: '+e.message);return}
  view={page:'home',id:null};await load()}

/* ===== Attachments ===== */
const MAX_FILES=10,MAX_BYTES=8*1048576;
async function prepFile(f){
  if(/^image\/(jpeg|png|webp|bmp)$/.test(f.type)){
    try{const bmp=await createImageBitmap(f),s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
      const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
      const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(bmp,0,0,cv.width,cv.height);
      const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));
      if(b&&b.size<f.size)return{name:f.name.replace(/\.[^.]+$/,'')+'.jpg',type:'image/jpeg',size:b.size,blob:b}}catch{}}
  if(f.size>MAX_BYTES)throw new Error(`"${f.name}" is larger than 8 MB`);
  return{name:f.name,type:f.type||'application/octet-stream',size:f.size,blob:f}}
$('tFiles').onchange=async e=>{const files=[...e.target.files];e.target.value='';const er=$('tErr');er.textContent='';
  for(const f of files){
    if(curAtt.filter(a=>!removedAtt.has(a.id)).length+pending.length>=MAX_FILES){er.textContent='Maximum '+MAX_FILES+' attachments.';break}
    try{pending.push(await prepFile(f))}catch(x){er.textContent=x.message}}
  drawFiles()};
function drawFiles(){
  $('fList').innerHTML=curAtt.filter(a=>!removedAtt.has(a.id)).map(a=>`<div class="file"><span>📎 ${esc(a.name)} · ${fmtSize(a.size)}</span><button class="btn red sm" onclick="removedAtt.add(${a.id});drawFiles()">✕</button></div>`).join('')
   +pending.map((p,i)=>`<div class="file"><span>🆕 ${esc(p.name)} · ${fmtSize(p.size)}</span><button class="btn red sm" onclick="pending.splice(${i},1);drawFiles()">✕</button></div>`).join('')}
let urls=[];
function viewAtt(txId){urls=[];
  $('attBody').innerHTML='<div class="thumbs">'+(attByTx.get(txId)||[]).map(a=>{const u=URL.createObjectURL(a.blob);urls.push(u);
    return /^image\//.test(a.type)?`<a href="${u}" target="_blank"><img src="${u}" alt=""><span>${esc(a.name)}</span></a>`
      :`<a href="${u}" download="${esc(a.name)}">📄<br>${esc(a.name)}<br>${fmtSize(a.size)}</a>`}).join('')+'</div>';
  dAtt.showModal()}
dAtt.addEventListener('close',()=>{urls.forEach(URL.revokeObjectURL);urls=[]});

/* ===== Transaction actions ===== */
function openTx(type,id=null){txType=type;editTx=id;const t=txs.find(x=>x.id===id)||{};
  curAtt=id?(attByTx.get(id)||[]):[];removedAtt=new Set();pending=[];
  $('dTxT').textContent=(id?'Edit ':'')+(type==='in'?'Money In':'Money Out');
  $('dTxT').style.color=type==='in'?'var(--in)':'var(--out)';
  $('tSave').className='btn '+(type==='in'?'green':'red');
  $('tDate').value=t.date||today();$('tAmt').value=t.amount?(t.amount/100).toFixed(2):'';$('tNote').value=t.note||'';$('tErr').textContent='';
  drawFiles();dTx.showModal();$('tAmt').focus()}
async function saveTx(){const amount=parseMoney($('tAmt').value),date=$('tDate').value,er=$('tErr');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){er.textContent='Pick a valid date.';return}
  if(amount===null){er.textContent='Enter a valid amount greater than 0 (max 2 decimals).';return}
  const rec={customerId:view.id,type:txType,amount,date,note:$('tNote').value.trim()};
  if(editTx)rec.id=editTx;
  const rm=[...removedAtt],add=[...pending];
  try{await DB.write(['customers','transactions','attachments'],t=>{
    const as=t.objectStore('attachments');
    t.objectStore('customers').get(rec.customerId).onsuccess=e=>{
      if(!e.target.result){t.abort();return}
      const q=t.objectStore('transactions').put(rec);
      q.onsuccess=()=>{rm.forEach(k=>as.delete(k));add.forEach(p=>as.add({txId:q.result,name:p.name,type:p.type,size:p.size,blob:p.blob}))}}})}
  catch(e){er.textContent='Not saved (nothing was changed): '+e.message;return}
  dTx.close();await load()}
async function delTx(id){if(!confirm('Delete this transaction and its attachments?'))return;
  try{await DB.write(['transactions','attachments'],t=>{const as=t.objectStore('attachments');
    as.index('txId').getAllKeys(id).onsuccess=e=>e.target.result.forEach(k=>as.delete(k));
    t.objectStore('transactions').delete(id)})}catch(e){alert('Delete failed, nothing was changed: '+e.message);return}
  await load()}

/* ===== Backup / Restore (includes attachments) ===== */
const toDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportData(){
  const A=[];for(const a of atts)A.push({id:a.id,txId:a.txId,name:a.name,type:a.type,size:a.size,data:await toDataURL(a.blob)});
  const blob=new Blob([JSON.stringify({app:'pap-jyasa-pasal',version:2,customers,transactions:txs,attachments:A})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pap-jyasa-pasal-backup-'+today()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  meta.lastBackup=Date.now();await DB.setMeta('lastBackup',meta.lastBackup);render()}
$('imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text()),A=d.attachments||[];
    if(d.app!=='pap-jyasa-pasal'||!Array.isArray(d.customers)||!Array.isArray(d.transactions))throw new Error('Not a valid backup file');
    const cs=new Set(d.customers.map(c=>c.id)),ts=new Set(d.transactions.map(t=>t.id));
    if(cs.size!==d.customers.length||ts.size!==d.transactions.length)throw new Error('Duplicate IDs in backup');
    if(!d.transactions.every(t=>Number.isSafeInteger(t.amount)&&t.amount>0&&(t.type==='in'||t.type==='out')&&cs.has(t.customerId)))throw new Error('Backup contains invalid or orphan transactions');
    if(!A.every(a=>ts.has(a.txId)&&typeof a.data==='string'))throw new Error('Backup contains invalid attachments');
    if(!confirm('Restore will REPLACE all current data with the backup. Continue?'))return;
    const blobs=[];for(const a of A)blobs.push({id:a.id,txId:a.txId,name:a.name,type:a.type,size:a.size,blob:await (await fetch(a.data)).blob()});
    await DB.write(['customers','transactions','attachments'],t=>{
      ['customers','transactions','attachments'].forEach(s=>t.objectStore(s).clear());
      d.customers.forEach(c=>t.objectStore('customers').put(c));
      d.transactions.forEach(x=>t.objectStore('transactions').put(x));
      blobs.forEach(b=>t.objectStore('attachments').put(b))});
    await load();alert('Backup restored successfully.')
  }catch(x){alert('Restore failed — your current data was NOT changed.\n'+x.message)}};

/* ===== Settings ===== */
async function renderSettings(){
  let storage='';try{const s=await navigator.storage.estimate();storage=`Storage used: ${fmtSize(s.usage||0)}`}catch{}
  $('app').innerHTML=`<button class="back" onclick="go()">← Back</button><h2 style="color:var(--gold);margin-top:0">Settings</h2>
  <div class="card"><h3 class="gold" style="margin-top:0">Change Password</h3>
    <label>Current password</label><input type="password" id="pwCur" autocomplete="current-password">
    <label>New password (min 6 characters)</label><input type="password" id="pwNew" autocomplete="new-password">
    <label>Confirm new password</label><input type="password" id="pwNew2" autocomplete="new-password">
    <div class="err" id="pwMsg"></div><button class="btn" onclick="changePw()">Update Password</button></div>
  <div class="card"><h3 class="gold" style="margin-top:0">Data Safety</h3>
    <div style="color:var(--mut);font-size:14px">${storage}<br>Last backup: ${meta.lastBackup?new Date(meta.lastBackup).toLocaleString():'never'}</div>
    <div class="bar"><button class="btn" onclick="exportData()">⬇ Download Backup</button>
    <button class="btn alt" onclick="$('imp').click()">⬆ Restore Backup</button>
    <button class="btn alt" onclick="showCheck()">✔ Verify Books</button></div>
    <div id="chk"></div></div>`}
function showCheck(){const r=checkBooks();
  $('chk').innerHTML=`<div class="card" style="margin:0"><b class="${r.issues.length?'out':'ok'}">${r.issues.length?'⚠ '+r.issues.length+' problem(s) found':'✔ All books are balanced and consistent'}</b>
  ${r.issues.length?'<ul class="chk">'+r.issues.map(i=>`<li>${esc(i)}</li>`).join('')+'</ul>':''}
  <div style="color:var(--mut);font-size:13px;margin-top:6px">${r.customers} customers · ${r.txs} transactions · ${r.atts} attachments<br>
  In ${fmt(r.G.i)} − Out ${fmt(r.G.o)} = Net ${fmt(r.G.bal)}</div></div>`}
async function changePw(){const m=$('pwMsg'),cur=$('pwCur').value,n=$('pwNew').value,n2=$('pwNew2').value;m.className='err';
  if(!(await verifyPw(cur))){m.textContent='Current password is wrong.';return}
  if(n.length<6){m.textContent='New password must be at least 6 characters.';return}
  if(n!==n2){m.textContent='New passwords do not match.';return}
  const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
  meta.auth={salt,hash:await hashPw(n,salt)};await DB.setMeta('auth',meta.auth);
  ['pwCur','pwNew','pwNew2'].forEach(i=>$(i).value='');m.className='ok';m.textContent='✔ Password changed.'}

/* ===== Start ===== */
async function start(){$('login').hidden=true;$('shell').hidden=false;bump();await load()}
(async()=>{
  try{if(!window.crypto||!crypto.subtle)throw new Error('Open this app over https (GitHub Pages) or localhost.');
    try{indexedDB.deleteDatabase('papJyasaPasal')}catch{}
    await DB.open();await loadMeta();
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
    if(sessionStorage.getItem('pap_auth')==='1')start();else{$('login').hidden=false;$('lpw').focus()}
  }catch(e){$('login').hidden=false;$('login').querySelector('.box').insertAdjacentHTML('beforeend','<div class="card out">Startup error: '+esc(e.message)+'</div>')}
})();
</script>
